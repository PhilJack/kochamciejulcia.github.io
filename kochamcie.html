<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #111;
      color: #eee;
      text-align: center;
      line-height: 1.6;
    }
    main { max-width: 800px; margin: 0 auto; padding: 2rem 1rem 5rem; }
    img { max-width: 100%; border-radius: 8px; margin: 1rem 0; }
    #music-btn {
      position: fixed; bottom: 1rem; right: 1rem;
      padding: 0.7rem 1.1rem; border: 0; border-radius: 999px;
      background: #eee; color: #111; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome</h1>
    <p>Write your text here.</p>

    <img src="images/photo1.jpg" alt="Describe the picture">
    <p>A caption or more text.</p>

    <img src="images/photo2.jpg" alt="Describe the picture">
  </main>

  <!-- Put your music file in a "music" folder -->
  <audio id="bg-music" src="music/song.mp3" loop></audio>
  <button id="music-btn">▶ Play music</button>

  <script>
    const audio = document.getElementById("bg-music");
    const btn = document.getElementById("music-btn");

    btn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        btn.textContent = "⏸ Pause music";
      } else {
        audio.pause();
        btn.textContent = "▶ Play music";
      }
    });
  </script>
</body>
</html>
